<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle Биполярка Web v1.0</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:18px 16px;background:#111936;border-bottom:1px solid #26345f}h1{margin:0;font-size:22px}
main{max-width:900px;margin:auto;padding:14px}.card{background:#121a32;border:1px solid #26345f;border-radius:16px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{font-size:12px;color:#aeb9d9;display:block}input,select{width:100%;margin-top:5px;padding:11px;border-radius:10px;border:1px solid #34446f;background:#0c1328;color:#fff;font-size:15px}
button{border:0;border-radius:10px;padding:12px 15px;background:#30477f;color:#fff;font-weight:700;margin:8px 6px 0 0}.primary{background:#2e8b57}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#0c1328;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:4px}
.signal{padding:16px;border-radius:14px;background:#192442;margin-top:12px;font-size:17px}.green{border:1px solid #2e8b57}.yellow{border:1px solid #b38b22}.red{border:1px solid #9b3d48}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #29365c;text-align:left}th{color:#9eabd0}
.small{font-size:12px;color:#8f9abb}.good{color:#65d391}.bad{color:#ff7180}
@media(max-width:600px){.grid,.result{grid-template-columns:1fr 1fr}.result .metric:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><h1>🔮 Oracle Биполярка — Web v1.0</h1><div class="small">Математический анализ футбольного LIVE</div></header>
<main>
<section class="card">
<h2>1. Матч</h2>
<div class="grid">
<div><label>Хозяева<input id="home" value="Команда 1"></label></div>
<div><label>Гости<input id="away" value="Команда 2"></label></div>
<div><label>Минута<input id="minute" type="number" value="45" min="0" max="120"></label></div>
<div><label>Счёт<input id="score" value="0:0"></label></div>
<div><label>Удары<input id="shots" value="0:0"></label></div>
<div><label>Удары в створ<input id="sot" value="0:0"></label></div>
<div><label>Угловые<input id="corners" value="0:0"></label></div>
<div><label>Красные<input id="reds" value="0:0"></label></div>
</div>
</section>

<section class="card">
<h2>2. Коэффициенты</h2>
<div class="grid">
<div><label>П1<input id="o1" type="number" step=".01" value="2.00"></label></div>
<div><label>X<input id="ox" type="number" step=".01" value="3.40"></label></div>
<div><label>П2<input id="o2" type="number" step=".01" value="3.50"></label></div>
<div><label>ТБ 2.5<input id="ov" type="number" step=".01" value="2.00"></label></div>
<div><label>ТМ 2.5<input id="ou" type="number" step=".01" value="1.80"></label></div>
<div><label>Минимальный EV %<input id="minEv" type="number" step=".1" value="3"></label></div>
</div>
<button class="primary" onclick="analyze()">РАССЧИТАТЬ</button>
<button onclick="demo()">ТЕСТОВЫЙ МАТЧ</button>
</section>

<section class="card">
<h2>3. Итог</h2>
<div class="result">
<div class="metric">Лучший рынок<b id="best">—</b></div>
<div class="metric">Вероятность<b id="prob">—</b></div>
<div class="metric">EV<b id="ev">—</b></div>
</div>
<div id="signal" class="signal red">Введите данные и нажмите «Рассчитать».</div>
</section>

<section class="card">
<h2>4. Все рынки</h2>
<table><thead><tr><th>Рынок</th><th>КФ</th><th>Вероятность</th><th>Fair</th><th>EV</th></tr></thead>
<tbody id="rows"></tbody></table>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
function n(id){return Number($(id).value)||0}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function parsePair(v){let a=String(v).split(':').map(Number);return [a[0]||0,a[1]||0]}
function pois(k,l){return Math.exp(-l)*Math.pow(l,k)/fact(k)}
function fact(k){let x=1;for(let i=2;i<=k;i++)x*=i;return x}
function poisson1x2(lh,la){
 let p1=0,px=0,p2=0;
 for(let h=0;h<=12;h++)for(let a=0;a<=12;a++){
   let p=pois(h,lh)*pois(a,la);
   if(h>a)p1+=p; else if(h===a)px+=p; else p2+=p;
 }
 return [p1,px,p2]
}
function analyze(){
 const minEv=n('minEv')/100, min=Math.max(0,n('minute'));
 const [sh,sa]=parsePair($('score').value);
 const rem=clamp((90-min)/90,0,1);
 const [shotsH,shotsA]=parsePair($('shots').value);
 const [sotH,sotA]=parsePair($('sot').value);
 const [corH,corA]=parsePair($('corners').value);
 const [redH,redA]=parsePair($('reds').value);
 let lh=.95*rem, la=.85*rem;
 lh += Math.max(-.3,Math.min(.5,(shotsH-shotsA)*.035));
 la += Math.max(-.3,Math.min(.5,(shotsA-shotsH)*.035));
 lh += Math.max(-.25,Math.min(.35,(sotH-sotA)*.07));
 la += Math.max(-.25,Math.min(.35,(sotA-sotH)*.07));
 lh += Math.max(-.12,Math.min(.18,(corH-corA)*.018));
 la += Math.max(-.12,Math.min(.18,(corA-corH)*.018));
 lh += (redA-redH)*.20; la += (redH-redA)*.20;
 lh=Math.max(.03,lh);la=Math.max(.03,la);
 const [p1,px,p2]=poisson1x2(lh,la);
 const totalLambda=lh+la;
 const pOver=1-Math.exp(-totalLambda)*(1+totalLambda+totalLambda**2/2);
 const markets=[
  ['П1',n('o1'),p1],['X',n('ox'),px],['П2',n('o2'),p2],
  ['ТБ 2.5',n('ov'),pOver],['ТМ 2.5',n('ou'),1-pOver]
 ].map(x=>({name:x[0],odd:x[1],p:x[2],fair:1/x[2],ev:x[2]*x[1]-1}));
 const valid=markets.filter(x=>x.odd>1);
 const best=valid.sort((a,b)=>b.ev-a.ev)[0];
 $('best').textContent=best.name;$('prob').textContent=(best.p*100).toFixed(1)+'%';$('ev').textContent=(best.ev*100).toFixed(1)+'%';
 $('ev').className=best.ev>=0?'good':'bad';
 $('rows').innerHTML=markets.map(x=>`<tr><td>${x.name}</td><td>${x.odd.toFixed(2)}</td><td>${(x.p*100).toFixed(1)}%</td><td>${x.fair.toFixed(2)}</td><td class="${x.ev>=0?'good':'bad'}">${(x.ev*100).toFixed(1)}%</td></tr>`).join('');
 const s=$('signal');
 if(best.ev>=minEv){s.className='signal green';s.innerHTML='🟢 <b>VALUE</b> — '+best.name+' · EV '+(best.ev*100).toFixed(1)+'%';}
 else if(best.ev>0){s.className='signal yellow';s.innerHTML='🟡 <b>ПОЛОЖИТЕЛЬНЫЙ EV</b>, но ниже заданного порога';}
 else{s.className='signal red';s.innerHTML='🔴 <b>VALUE НЕ НАЙДЕН</b> по введённым коэффициентам';}
}
function demo(){
 $('home').value='Франция';$('away').value='Италия';$('minute').value=54;$('score').value='0:0';
 $('shots').value='7:4';$('sot').value='3:2';$('corners').value='4:2';$('reds').value='0:0';
 $('o1').value=1.60;$('ox').value=3.35;$('o2').value=7.00;$('ov').value=2.10;$('ou').value=1.70;
 analyze();
}
analyze();
</script>
</body>
</html>
